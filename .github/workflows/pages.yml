# Builds the wiki into a browsable website with Quartz and deploys it
# to GitHub Pages. Separate from deploy-mcp.yml — the MCP workers are
# untouched by this workflow.
#
# Currently manual-trigger only: GitHub Pages must be enabled on the repo
# (Settings → Pages → Source: GitHub Actions) before the deploy step can
# succeed. Once Pages is enabled, uncomment the push trigger so the site
# redeploys on every wiki change, in step with the MCP bundle.
name: Deploy wiki site to GitHub Pages

on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths: ["wiki/**", "quartz/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quartz reads git history for page dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        working-directory: quartz
        run: |
          npm ci
          npx quartz build -d ../wiki
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
